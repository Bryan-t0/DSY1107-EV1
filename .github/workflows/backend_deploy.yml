name: Backend Deploy
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend_deploy.yml']
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: backend-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build JAR
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress package
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build y push ECR
        env: { REPO: '${{ vars.ECR_REPO }}' }
        run: docker build --platform linux/amd64 -t "$REPO:${GITHUB_SHA}" -t "$REPO:latest" backend && docker push "$REPO:${GITHUB_SHA}" && docker push "$REPO:latest"
      - name: Obtener task definition y actualizar imagen
        env: { FAMILY: '${{ vars.ECS_SERVICE }}', REPO: '${{ vars.ECR_REPO }}' }
        run: |
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition --output json | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' > task.json
          jq --arg IMG "$REPO:${GITHUB_SHA}" '.containerDefinitions[0].image=$IMG' task.json > task-new.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://task-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "${{ vars.ECS_SERVICE }}" --task-definition "$ARN" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_SERVICE }}"
      - name: Reapuntar API Gateway a IP actual
        run: |
          TASK=$(aws ecs list-tasks --cluster "${{ vars.ECS_CLUSTER }}" --service-name "${{ vars.ECS_SERVICE }}" --desired-status RUNNING --query 'taskArns[0]' --output text)
          ENI=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK" --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
          IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          aws apigatewayv2 update-integration --api-id "${{ vars.API_ID }}" --integration-id "${{ vars.INTEGRATION_ID }}" --integration-uri "http://${IP}:8080/datos" >/dev/null
          echo "Backend desplegado en $IP y API Gateway actualizado."
