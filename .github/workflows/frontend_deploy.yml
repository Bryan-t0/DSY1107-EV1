name: Frontend Deploy
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'scripts/**', '.github/workflows/frontend_deploy.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Crear configuración runtime
        env:
          COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          REDIRECT_URI: ${{ vars.REDIRECT_URI }}
          API_URL: ${{ vars.API_URL }}
        run: |
          mkdir -p frontend/public
          cat > frontend/public/config.json <<EOF
          {"cognitoDomain":"$COGNITO_DOMAIN","clientId":"$CLIENT_ID","redirectUri":"$REDIRECT_URI","apiUrl":"$API_URL"}
          EOF
      - working-directory: frontend
        run: npm install && npm run build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Publicar en Amplify
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          BRANCH: ${{ vars.AMPLIFY_BRANCH || 'main' }}
        run: scripts/publicar-amplify.sh "$APP_ID" "$BRANCH" "frontend/dist"
