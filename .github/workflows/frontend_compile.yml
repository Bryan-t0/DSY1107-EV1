name: Frontend Angular Compile

on:
  push:
    branches:
      - main
      - develop
      - feature/**
    paths:
      - 'frontend-angular/**'
      - '.github/workflows/frontend_compile.yml'

  pull_request:
    paths:
      - 'frontend-angular/**'
      - '.github/workflows/frontend_compile.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend-angular
        run: npm ci

      - name: Compilar Angular
        working-directory: frontend-angular
        run: npm run build